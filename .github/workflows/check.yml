name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 25 runs the Gradle daemon (gradle/gradle-daemon-jvm.properties), 17 is the
      # toolchain the modules compile against.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            25

      - uses: gradle/actions/setup-gradle@v5

      - run: >
          ./gradlew check assembleDebug
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_25_X64

      # Against SeaweedFS in Docker, which the runner has (TR-48).
      - run: >
          ./gradlew :backend-s3:integrationTest
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_25_X64

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: "**/build/reports/"

  # The release apk's dependencies against the licence policy set in FOSSA (.fossa.yml).
  # Forks' pull requests get no secrets, so they skip it.
  licences:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            25

      - uses: gradle/actions/setup-gradle@v5

      # FOSSA runs ./gradlew itself, without the flag the other jobs pass.
      - run: >
          echo org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_25_X64
          >> "${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties"

      - uses: fossas/fossa-action@29693cc50323968e039056be419b32989fc5880c # v2.0.0
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
          pinned-cli-version: v3.20.1

      - uses: fossas/fossa-action@29693cc50323968e039056be419b32989fc5880c # v2.0.0
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
          pinned-cli-version: v3.20.1
          run-tests: true

  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            25

      - uses: gradle/actions/setup-gradle@v5

      # Two clean clones built without the build cache must give the same apk (TR-51).
      - run: >
          make reproducible
          GRADLE_ARGS=-Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_25_X64
