name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 25 runs the Gradle daemon (gradle/gradle-daemon-jvm.properties), 17 is the
      # toolchain the modules compile against.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            25

      - uses: gradle/actions/setup-gradle@v5

      - run: >
          ./gradlew check assembleDebug
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_25_X64

      # Against SeaweedFS in Docker, which the runner has (TR-48).
      - run: >
          ./gradlew :backend-s3:integrationTest
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_25_X64

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: "**/build/reports/"
